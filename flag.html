<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            border: 10px solid;
            width: 550px;
            height: 550px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            background: linear-gradient(to bottom, orange, white, green);
        }
        div{
            border: 10px solid blue;
            background-color: blu;
            width: 200px;
            height: 200px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <section>
        <div></div>
    </section>
</body>
</html>
