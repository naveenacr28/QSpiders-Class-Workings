<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            border: 5px red solid;
            height: 500px;
            width: 500px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-evenly;
            /* gap: 10px; --> used to add space between div containers */
        }
        div{
            border: 2px solid;
            height: 150px;
            width: 150px;
            text-align: center;
            font-size: larger;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <main>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </main>
</body>
</html>
