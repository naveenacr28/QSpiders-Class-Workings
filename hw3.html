<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset {
            width: 800px;
        }
    
        legend {
            text-align: center;
        }
    
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1><b>Biodata Form</b></h1>
    <form class="abc">
        <fieldset>
            <table border="2" cellpadding="10" cellspacing="0" width="85%">
    
                <tr>
                    <td>Name:</td>
                    <td><input type="text" placeholder="Insert your name"></td>
                </tr>
    
                <tr>
                    <td>Age:</td>
                    <td><input type="number"></td>
                </tr>
    
                <tr>
                    <td>Sex:</td>
                    <td>
                        <input type="radio" name="sex"> Male <br>
                        <input type="radio" name="sex"> Female
                    </td>
                </tr>
    
                <tr>
                    <td>Address:</td>
                    <td>
                        <textarea rows="4" cols="40" placeholder="Insert your address"></textarea>
                    </td>
                </tr>
    
                <tr>
                    <td>Email:</td>
                    <td><input type="email" placeholder="Insert your email"></td>
                </tr>
    
                <tr>
                    <td>Date of Birth:</td>
                    <td><input type="date"></td>
                </tr>
    
                <tr>
                    <td>Height:</td>
                    <td>
                        <input type="range" min="100" max="200"> 150cm
                    </td>
                </tr>
    
                <tr>
                    <td>Tel:</td>
                    <td><input type="tel" placeholder="+60##-#######"></td>
                </tr>
    
                <tr>
                    <td>My Favorite Color:</td>
                    <td><input type="color"></td>
                </tr>
    
                <tr>
                    <td>Fb/TW/IG:</td>
                    <td><input type="url" placeholder="Insert the URL"></td>
                </tr>
    
                <tr>
                    <td>My Face Photo:</td>
                    <td><input type="file"></td>
                </tr>
    
                <tr>
                    <td>My University:</td>
                    <td>
                        <select>
                            <option>Select</option>
                            <option>VTU</option>
                            <option>Mysore University</option>
                            <option>Bangalore University</option>
                        </select>
                    </td>
                </tr>
    
            </table>
    
            <br>
            <center>
            <button style="background-color: green;">Submit My Biodata</button>
            <button style="background-color: red;">Reset</button>
            </center>
        </fieldset>
    </form>
</body>
</html>
