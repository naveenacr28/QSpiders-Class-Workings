<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Login</legend>
            <label for="Username">Username:</label>
            <input type="text" id="Username" name="Username" required>
            <br><br>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="password" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <button>Submit</button>
            <button>Reset</button>
        </fieldset>
    </form>
</body>
</html>

<!--
1. type tells which type value is storing
2. id is used to connect action between label and input layout
3. name is used to mention the value in backend storage
4. required attribute tell that it is an mandatory field
-->
