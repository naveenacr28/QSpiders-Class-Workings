<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        fieldset{
            width: 500px;
        }
        form {
            width: 500px;
        }
    </style>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Application Form</legend>
            <label for="">Username:</label>
            <input type="text" placeholder="Enter Name">
            <br><br>
            <label for="">Email:</label>
            <input type="email" placeholder="Enter Email">
            <br><br>
            <label for="">Password:</label>
            <input type="password" placeholder="Enter Password">
            <br><br>
            <label for="">Ph Number:</label>
            <input type="tel" minlength="10" maxlength="10">
            <br><br>
            <label for="Age">Age:</label>
            <input type="number" min="20" max="25">
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="datetime-local">
            <br><br>
            <label for="">Gender:</label>
            <input type="radio" name="male" value="male">Male
            <input type="radio" name="female" value="female">Female
            <input type="radio" name="" id="other" value="other">Other
            <br><br>
            <label for="">Address: </label><br>
            <textarea name="" id="" rows="7" cols="30"></textarea><br><br>
            <label for="">Select State</label>
            <select name="select" id="select" required>
            <option value="">Select State</option>
            <option value="">KARNATAKA</option>
            <option value="">TAMILNADU</option>
            <option value="">KERALA</option>
            </select>
            <br><br>
            <label for="">Select Skills:</label>
            <input type="checkbox" value="Java">Java
            <input type="checkbox" value="Python" checked>Python
            <input type="checkbox" value="MERN">MERN
            <input type="checkbox" value="SQL">SQL
            

        <br><br>
        <button>Submit</button>
        <button>Reset</button>

        </fieldset>

    </form>
</body>
</html>

<!--
text, password, email, value, min,  max, minlenght, maxlength, date, datetime-local,
textarea, rows, cols, radio, checkbox, checked, select, option, placeholder
-->
