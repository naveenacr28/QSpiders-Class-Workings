        *{
            padding: 0;
            margin: 0;
        }
        nav{
            height: 60px;
            width: 100%;
            display: flex;
            box-sizing: border-box;
            background-color: aliceblue;
            /* background: linear-gradient(90deg, hsla(333, 100%, 53%, 1) 0%, hsla(33, 94%, 57%, 1) 100%);; */
        }
        nav #id1{
            height: 60px;
            display: flex;
            flex-basis: 7%;
            align-items: center;
            justify-content: space-evenly;

        }
        nav #id2{
            height: 60px;
            display: flex;
            flex-basis: 50%;
            /* background-color: red; */
            align-items: center;
            justify-content: space-evenly;

        }
        nav #id3{
            height: 60px;
            display: flex;
            flex-basis: 20%;
            /* background-color: yellowgreen; */
            align-items: center;
            justify-content: space-evenly;

        }
        nav #id4{
            height: 60px;
            display: flex;
            flex-basis: 23%;
            /* background-color: yellow; */
            align-items: center;
            justify-content: space-evenly;
   
        }
        nav #id3 h4{
            height: 60px;
            display: flex;
            flex-basis: 20%;
            align-items: center;
            justify-content: space-around;
            text-align: center;
        }
        nav img{
            height: 55px;
            border-radius: 20px;
        }
        nav #id2 ol{
            height: 60px;
            display: flex;
            flex-basis: 100%;
            align-items: center;
            justify-content: space-around;
            list-style-type: none;
        }
        nav #id2 ol a{
            text-decoration:none;
            color: black;
        }
        nav #id2 ol a:hover{
            /* color: aliceblue; */
            color: rgb(209, 14, 14);
            text-decoration: underline;
        }
        nav #id3 h4 a{
            text-decoration: none;
        }
        nav #id3 h4 a:hover{
            /* color: aliceblue; */
            color: rgb(209, 14, 14);
            text-decoration:underline;
        }
        nav #id4 ol{
            list-style-type: none;
        }
        nav #id4 ol input{
            width: 300px;
            height: 40px;
            display: flex;
        }

    </style>
