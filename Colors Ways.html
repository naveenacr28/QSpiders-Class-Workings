<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            border: 10px solid;
            width: 550px;
            height: 550px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
        }
        div{
            border: 5px solid;
            width: 200px;
            height: 200px;
        }
        #id1{
            background-color: yellow;
        }
        #id2{
            background-color: #1f38c7;
        }
        #id3{
            background-color: rgb(0, 255, 0);
        }
        #id4{
            background-color: rgba(255, 0, 0, 0.9);
        }

    </style>
</head>
<body>
    <section class="parent">
        <div id="id1"></div>
        <div id="id2"></div>
        <div id="id3"></div>
        <div id="id4"></div>
    </section>
</body>
</html>
