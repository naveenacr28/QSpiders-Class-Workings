<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* <!--
            display:inline is used to convert block level element to inline level element
            --> */
        h1{
            border: 2px solid red;
            height: 300px;
            width: 400px;
            display: inline;
        }
        /* <!--
            display:inline is used to convert inline level element to block level element
            --> */
        b{
            border: 10px solid yellow;
            height: 500px;
            width: 600px;
            display: block;
        }
        /* <!--
            display:inline is used to convert inline level element to block level element and simularly used to convert block level element to inline level element and default it will act as inlinee level after adding width and hieght property it act as block level property
            --> */

        i{
            border: 5px solid blue;
            width: 400px;
            height: 400px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>NAVEENA CR</h1>
    <br><br><br>
    <b>THIS IS BOLD</b>
    <br><br><br>
    <i>ITALIC</i>
</body>
</html>
