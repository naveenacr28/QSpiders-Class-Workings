<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset {
            width: 800px;
        }
    
        legend {
            text-align: center;
        }
    
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form{
            background-color: whitesmoke;
        }
    </style>
</head>
<body>
    <form class="hm2">
        <fieldset>
            <legend>QSpiders/JSpiders/PySpiders</legend>
    
            <label>Name</label>
            <input type="text" placeholder="Enter Name"><br><br>
    
            <label>Password</label>
            <input type="password" placeholder="Enter Password"><br><br>
    
            <label>Email</label>
            <input type="email" placeholder="Enter Email"><br><br>
    
            <label>Date of Birth</label>
            <input type="date"><br><br>
    
            <label>Gender</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Others
            <br><br>
    
            <label>Course</label>
            <input type="checkbox"> Python Full Stack
            <input type="checkbox"> Java Full Stack
            <input type="checkbox"> MERN Stack
            <input type="checkbox"> MEAN Stack
            <input type="checkbox" checked> React JS
            <br><br>
    
            <label>Home Address</label><br>
            <textarea rows="4" cols="30"></textarea>
            <br><br>
    
            <label>State</label>
            <select>
                <option>Karnataka</option>
                <option>Tamil Nadu</option>
                <option>Kerala</option>
            </select>
            <br><br>
    
            <label>Qspiders Branch</label>
            <input type="text" value="Qspiders Mysore">
            <br><br>
    
            <label>Upload your resume</label>
            <input type="file">
            <br><br>
    
            <label>Select Colour</label>
            <input type="color">
            <br><br>
    
            <label>Select Range</label>
            <input type="range">
            <br><br>
    
            <label>Upload Image</label>
            <input type="file" accept="Image">
            <br><br>
    
            <label>Enter Git hub URL</label>
            <input type="url" placeholder="Enter Github url">
            <br><br>
    
            <label>Select Week</label>
            <input type="week">
            <br><br>
    
            <label>Select Month</label>
            <input type="month">
            <br><br>
    
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </fieldset>
    
    </form>
</body>
</html>
